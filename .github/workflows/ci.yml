name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shell scripts
        run: shellcheck -x rouvy install.sh tests/smoke.sh tests/helper.bash tests/stubs/*

      - name: Python
        run: python3 -m py_compile lib/vm-monitor.py tests/test_vm_monitor.py tests/test_docs.py

      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem shared/setup/*.ps1 | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Output "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($failed) { exit 1 }

      - name: Compose file
        run: docker compose --env-file rouvy.conf.example config --quiet

  # The launcher leans on bash, coreutils and util-linux, which differ between distributions and
  # releases (GNU coreutils or the Rust rewrite, bash 5.0 to 5.3), so the suites run in each
  # one's own userland with its own bats. "rolling" is whatever Ubuntu released last.
  test:
    name: test (${{ matrix.image }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:20.04
          - ubuntu:22.04
          - ubuntu:24.04
          - ubuntu:26.04
          - ubuntu:rolling
          - debian:12
          - debian:13
          - archlinux:latest
          - fedora:latest
          - opensuse/tumbleweed:latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the test tools
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends bats python3 procps desktop-file-utils
          elif command -v pacman >/dev/null; then
            pacman -Syu --noconfirm --needed bats python procps-ng desktop-file-utils
          elif command -v dnf >/dev/null; then
            dnf install -y bats python3 procps-ng desktop-file-utils
          else
            zypper --non-interactive install bats python3 procps desktop-file-utils
          fi

      - name: Launcher and installer
        run: bats tests

      - name: QEMU monitor client
        run: python3 -W error -m unittest discover -s tests -v
